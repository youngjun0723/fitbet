# 운영 프로필: -Dspring.profiles.active=prod (Dockerfile에서 지정)
# application.yml(H2 개발 설정) 위에 이 파일 값이 덮어써진다.
# 비밀번호 같은 민감 정보는 파일에 적지 않고 환경변수(${...})로 받는다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  h2:
    console:
      enabled: false   # 운영에서 DB 콘솔이 열려 있으면 그대로 보안 구멍
  jpa:
    hibernate:
      # MVP 단계: 엔티티 기준으로 없는 테이블/컬럼만 추가한다(기존 데이터는 지우지 않음).
      # 스키마가 자주 바뀌기 시작하면 Flyway 같은 마이그레이션 도구로 넘어갈 것.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  # Caddy(리버스 프록시)가 붙여 주는 X-Forwarded-* 헤더를 믿는다 → https, 실제 호스트명 인식
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30d       # 친구들이 매일 다시 로그인하지 않도록
      cookie:
        secure: true     # HTTPS에서만 쿠키 전송
        http-only: true  # JS에서 세션 쿠키 접근 불가 (XSS로 세션 탈취 방지)
        same-site: lax

fitbet:
  storage:
    local-dir: ${UPLOAD_DIR:/data/uploads}  # Docker 볼륨에 저장 → 컨테이너를 다시 만들어도 사진 유지
  closing:
    catch-up-days: 7
